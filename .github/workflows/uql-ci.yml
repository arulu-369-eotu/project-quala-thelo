name: UQL CI

on:
  push:
    paths:
      - "citadel-core/**"
      - ".github/workflows/uql-ci.yml"
  pull_request:
    paths:
      - "citadel-core/**"
      - ".github/workflows/uql-ci.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: citadel-core/pyproject.toml
      - name: Install package and tests
        run: python -m pip install -e "./citadel-core[test]"
      - name: Run tests
        run: python -m pytest -q "./citadel-core/tests"
