name: UQL compatibility CI

on:
  push:
    paths:
      - 'citadel-core/**'
      - 'scripts/build_test_openssl.sh'
      - '.github/workflows/uql-ci.yml'
  pull_request:
    paths:
      - 'citadel-core/**'
      - 'scripts/build_test_openssl.sh'
      - '.github/workflows/uql-ci.yml'

permissions:
  contents: read

concurrency:
  group: uql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The hash-locked full-repository workflow covers Python 3.12.
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin bootstrap tooling
        run: python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0
      - name: Resolve compatible core dependencies
        run: python -m pip install --no-build-isolation -e './citadel-core[test]' pip-audit==2.10.1
      - name: Build verified native ML-KEM provider
        run: bash scripts/build_test_openssl.sh
      - name: Run core tests
        env:
          UQL_OPENSSL_LIBRARY: ${{ github.workspace }}/.test-openssl/openssl-3.5.8/libcrypto.so.3
        run: python -m pytest -q citadel-core/tests
      - name: Audit this compatibility environment
        run: |
          mkdir -p audit-output
          python -m pip freeze --all --exclude uql-omniversal-compiler > audit-output/requirements.txt
          python -m pip_audit --strict --disable-pip --no-deps -r audit-output/requirements.txt
