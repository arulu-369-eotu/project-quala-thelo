name: UQL CI

on:
  push:
    paths:
      - "citadel-core/**"
  pull_request:
    paths:
      - "citadel-core/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and tests
        run: python -m pip install -e "./citadel-core[test]"
      - name: Run tests
        run: python -m pytest -q "./citadel-core/tests"
