name: UQL CI

on:
  push:
    paths:
      - "citadel-core/**"
      - ".github/workflows/uql-ci.yml"
  pull_request:
    paths:
      - "citadel-core/**"
      - ".github/workflows/uql-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Python and build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv python3-pip openssl libssl-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assert OpenSSL ML-KEM support
        run: |
          openssl version
          openssl list -kem-algorithms | grep -F 'ML-KEM-1024'
      - name: Install package and tests
        run: |
          python3 -m venv /tmp/uql-ci-venv
          /tmp/uql-ci-venv/bin/python -m pip install --upgrade pip
          /tmp/uql-ci-venv/bin/python -m pip install -e "./citadel-core[test]"
      - name: Run full tests
        run: /tmp/uql-ci-venv/bin/python -m pytest -q "./citadel-core/tests"
