name: PROOF-369 CI Attestation

on:
  push:
    branches:
      - main
      - feat/quala-enterprise-trust-exchange-20261009
    paths:
      - 'enterprise-trust-plane/**'
      - '.github/workflows/proof369-attested-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  measurable-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install passport dependencies
        run: python -m pip install -e './enterprise-trust-plane[test]'
      - name: Execute instrumented tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python -m pytest -q enterprise-trust-plane/tests --junitxml=artifacts/pytest.xml
      - name: Normalize measured JUnit results
        id: evidence
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: |
          PYTHONPATH=enterprise-trust-plane/src python enterprise-trust-plane/scripts/create_ci_report.py \
            --junit artifacts/pytest.xml \
            --output artifacts/proof369-ci.json
      - name: Publish authenticated GitHub provenance
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/proof369-ci.json
      - name: Independently verify GitHub attested report with GitHub CLI
        id: verification
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify artifacts/proof369-ci.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/proof369-attested-ci.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" --format json > artifacts/verification-result.json
          python -c 'import json; x=json.load(open("artifacts/verification-result.json")); assert isinstance(x,list) and len(x)>0'
      - name: Preserve report for an independent verifier
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof369-ci-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/proof369-ci.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail when measured tests did not succeed
        if: ${{ always() }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
        run: |
          test "$TEST_OUTCOME" = success
          test "$EVIDENCE_OUTCOME" = success
          test "$VERIFICATION_OUTCOME" = success
