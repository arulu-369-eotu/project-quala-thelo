[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quala-enterprise-trust"
version = "0.1.0"
description = "Experimental enterprise credential verifier for QUA'LA Trust Passport"
requires-python = ">=3.11"
dependencies = ["cryptography>=47,<52"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
