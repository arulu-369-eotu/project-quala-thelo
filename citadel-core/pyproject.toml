[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uql-omniversal-compiler"
version = "1.2.0"
description = "Verified cryptographic and quantum compiler mechanisms for UQL."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=47,<52",
  "cirq-core>=1.5,<2",
  "qiskit>=2.5.2,<2.6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["uql_compiler"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
